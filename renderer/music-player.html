<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Stellar · lecteur</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 14px/1.3 "Segoe UI Variable Text", "Segoe UI", sans-serif; color: #f2f3fb; user-select: none; }
    .p { position: absolute; inset: 6px; border-radius: 20px; background: rgba(12, 15, 28, .94); border: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 14px 40px rgba(0, 0, 0, .5); overflow: hidden; display: flex; flex-direction: column; }
    .head { -webkit-app-region: drag; display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px 14px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .6); }
    .head b { color: #fff; letter-spacing: .02em; text-transform: none; font-size: 13px; }
    .head .sp { flex: 1; }
    .x { -webkit-app-region: no-drag; width: 26px; height: 26px; border: 0; border-radius: 8px; background: transparent; color: rgba(255, 255, 255, .7); font-size: 16px; cursor: pointer; }
    .x:hover { background: rgba(255, 255, 255, .12); color: #fff; }
    .body { flex: 1; position: relative; display: flex; align-items: center; gap: 12px; padding: 4px 14px 12px; }
    .viz { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: flex; align-items: flex-end; gap: 3px; padding: 0 10px; opacity: .28; pointer-events: none; }
    .viz i { flex: 1; background: linear-gradient(0deg, #7c6cff, #ff86c3); border-radius: 2px 2px 0 0; height: 10%; transition: height .18s ease; }
    .cover { position: relative; width: 64px; height: 64px; border-radius: 14px; object-fit: cover; flex: none; background: linear-gradient(135deg, #7c6cff, #ff86c3); display: grid; place-items: center; font-size: 26px; }
    .meta { position: relative; min-width: 0; flex: 1; }
    .src { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .55); }
    .title { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { color: rgba(255, 255, 255, .65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctrl { position: relative; display: flex; align-items: center; gap: 6px; }
    .ctrl button { border: 0; background: transparent; color: #fff; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
    .ctrl button:hover { background: rgba(255, 255, 255, .12); }
    .ctrl .pp { width: 46px; height: 46px; background: #fff; color: #0c0f1c; }
    .ctrl .pp:hover { background: #e9e6ff; }
    svg { width: 18px; height: 18px; fill: currentColor; }
    .vol { position: relative; display: flex; gap: 2px; }
    .vol button { width: 30px; height: 30px; border: 0; border-radius: 9px; background: rgba(255, 255, 255, .1); color: #fff; font: 800 16px/1 "Segoe UI", sans-serif; cursor: pointer; }
    .vol button:hover { background: rgba(255, 255, 255, .2); }
  </style>
</head>
<body>
  <div class="p">
    <div class="head"><span>♫</span><b>Stellar · Musique</b><span class="sp"></span><span id="src"></span><button class="x" id="close" title="Fermer" aria-label="Fermer">✕</button></div>
    <div class="body">
      <div class="viz" id="viz"></div>
      <div class="cover" id="cover">🎵</div>
      <div class="meta"><div class="title" id="title">Aucune musique</div><div class="artist" id="artist">Lance Spotify, Deezer ou une vidéo</div></div>
      <div class="vol"><button data-c="voldown" title="Volume -" aria-label="Baisser le volume">−</button><button data-c="volup" title="Volume +" aria-label="Monter le volume">+</button></div>
      <div class="ctrl">
        <button data-c="prev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="pp" data-c="toggle" id="pp" aria-label="Lecture / pause"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>
        <button data-c="next" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      </div>
    </div>
  </div>
  <script src="music-player.js"></script>
</body>
</html>
